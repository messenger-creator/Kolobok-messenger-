<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Веб-мессенджер</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--text:#1c1e21;--muted:#7a8088;--accent:#3b82f6;--other:#e8eaee;--line:#e2e4e8;--danger:#e5484d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111316;--panel:#1a1d21;--text:#e8eaed;--muted:#8b929a;--other:#2a2e34;--line:#2a2e34}}
:root[data-theme="dark"]{--bg:#111316;--panel:#1a1d21;--text:#e8eaed;--muted:#8b929a;--other:#2a2e34;--line:#2a2e34}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
button{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:9px 14px;font:inherit;cursor:pointer}
label.btn{position:relative;overflow:hidden;display:inline-block;border-radius:10px;background:var(--accent);color:#fff;padding:9px 14px;cursor:pointer}
label.btn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;font-size:0}
input[type=checkbox]{width:22px;height:22px;padding:0}input[type=range]{width:140px;padding:0}
.set{max-width:480px;margin:0 auto;padding:14px;height:100%;overflow-y:auto}
.card{background:var(--panel);border-radius:14px;padding:6px 14px;margin-bottom:6px;border:1px solid var(--line)}
.stitle{color:var(--accent);font-weight:600;font-size:13px;margin:16px 4px 6px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.sw{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;display:inline-block;margin-left:6px}.sw.on{border-color:var(--text)}
.seg button{padding:6px 10px;margin-left:4px}
.notime .m i{display:none}
#side .top #mn{flex:none;padding:9px 13px;font-size:17px}
#dov{position:fixed;inset:0;background:#0006;display:none;z-index:20}
#drawer{position:fixed;left:0;top:0;bottom:0;width:280px;max-width:85%;background:var(--panel);z-index:21;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;box-shadow:2px 0 12px #0004}
#drawer.open{transform:none}
#drawer .ph{padding:22px 18px 16px;background:var(--accent);color:#fff}#drawer .ph small{display:block;opacity:.85;margin-top:2px}
#drawer .row:hover{background:var(--other)}
button.g{background:var(--other);color:var(--text)}button.d{background:var(--danger)}
input{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;outline:none;width:100%}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;width:36px;height:36px;font-size:19px}
#reg{max-width:420px;margin:0 auto;padding:24px 18px;height:100%;overflow-y:auto}
#grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}
#grid .av{width:100%;height:auto;aspect-ratio:1;cursor:pointer;border:3px solid transparent}
#grid .av.on{border-color:var(--accent)}
#app{display:flex;height:100%;max-width:1000px;margin:0 auto;background:var(--panel)}
#side{width:260px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side .top{padding:12px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
#side .top button{flex:1;padding:9px 4px}
#list{flex:1;overflow-y:auto}
.row{padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.row.on{background:var(--other)}.row small{color:var(--muted);display:block}
#me{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;cursor:pointer}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
#head .t{flex:1;min-width:0;font-weight:600}#head small{display:block;color:var(--muted);font-weight:400}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.mr{display:flex;gap:8px;align-items:flex-end;max-width:85%}.mr.me{align-self:flex-end;flex-direction:row-reverse}
.m{padding:8px 12px;border-radius:14px;background:var(--other);white-space:pre-wrap;word-wrap:break-word;min-width:0}
.me .m{background:var(--accent);color:#fff}
.m b{display:block;font-size:12px;color:var(--accent)}.m i{font-size:11px;opacity:.6;margin-left:8px;font-style:normal}
#bar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.empty{margin:auto;color:var(--muted);text-align:center;padding:20px}
#back{display:none}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#box{background:var(--panel);border-radius:14px;padding:18px;width:100%;max-width:400px;max-height:85%;overflow-y:auto}
#box h3{margin:0 0 12px}#box .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:10}
@media (max-width:640px){#side{width:100%}#app.chat #side{display:none}#app:not(.chat) #main{display:none}#back{display:block}}

/* ===== красивое оформление ===== */
*{scrollbar-width:thin}
body{background:radial-gradient(circle at 15% 10%,color-mix(in srgb,var(--accent) 22%,var(--bg)),var(--bg) 55%)}
button{font-weight:500;transition:transform .12s,filter .15s}button:hover{filter:brightness(1.08)}button:active{transform:scale(.95)}
button:not(.g):not(.d){background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 65%,#8b5cf6));box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}
input{transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.av{box-shadow:0 1px 4px #0003}
@media (min-width:900px){#app{height:calc(100% - 32px);margin-top:16px;border-radius:22px;overflow:hidden;box-shadow:0 12px 48px #0003}}
#reg{margin-top:5vh;height:auto;max-height:90%;background:var(--panel);border-radius:22px;box-shadow:0 12px 48px #0003;padding:28px 22px}
#reg h2{margin:0 0 16px;font-size:24px;text-align:center;background:linear-gradient(135deg,var(--accent),#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
#grid .av{transition:transform .12s;border-radius:50%}#grid .av:hover{transform:scale(1.1)}
#grid .av.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
#side{background:var(--panel)}
#side .top{padding:12px 10px}
.row{margin:3px 8px;border-radius:14px;border-bottom:0;padding:10px 12px;transition:background .12s}
.row:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.row.on{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.row div:first-child{font-weight:500}
#head{padding:12px 16px;background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(8px);box-shadow:0 1px 6px #0001;border-bottom:0}
#msgs{padding:16px 14px;background:radial-gradient(circle at 15% 15%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 45%),radial-gradient(circle at 85% 85%,color-mix(in srgb,#8b5cf6 9%,transparent),transparent 45%),var(--bg)}
.mr{animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.m{padding:9px 14px;border-radius:18px 18px 18px 5px;box-shadow:0 1px 3px #0002;background:var(--panel);border:1px solid var(--line)}
.me .m{border:0;border-radius:18px 18px 5px 18px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 65%,#8b5cf6))}
.m i{display:block;text-align:right;margin:2px 0 0}
#bar{padding:10px 12px;gap:10px;border-top:0;background:var(--panel);box-shadow:0 -1px 6px #0001;align-items:center}
#in{border-radius:24px;padding:12px 18px}
#send{width:46px;height:46px;border-radius:50%;padding:0;font-size:18px;flex:none}
.empty{opacity:.75;font-size:14px;line-height:1.6;white-space:pre-line}
#drawer{border-radius:0 22px 22px 0}
#drawer .ph{background:linear-gradient(135deg,var(--accent),#8b5cf6);padding-top:26px}
#drawer .row{margin:2px 10px;padding:13px 14px;gap:14px}
.card{border-radius:18px;box-shadow:0 2px 10px #0001;padding:6px 16px}
.stitle{letter-spacing:.3px;text-transform:uppercase;font-size:12px}
#box{border-radius:22px;box-shadow:0 16px 48px #0005;animation:pop .18s ease-out}
#toast{background:#000c;backdrop-filter:blur(6px);box-shadow:0 4px 16px #0004}

/* ===== настройки ===== */
.set{padding:0 14px 24px}
.sh{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:12px 0;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(10px)}
.sh h2{margin:0;font-size:20px}.sh button{width:40px;height:40px;padding:0;border-radius:50%;font-size:18px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 16px 20px;border-radius:24px;color:#fff;margin-bottom:4px;background:linear-gradient(135deg,var(--accent),#8b5cf6);box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 35%,transparent)}
.hero .av{border:4px solid #fff8;box-shadow:0 4px 16px #0003}
.hn{font-size:21px;font-weight:700;margin-top:12px}.hb{opacity:.85;font-size:14px;margin:2px 0 14px}
.hero button{background:#fff3;box-shadow:none;backdrop-filter:blur(6px);padding:8px 16px;border-radius:20px}
.card{padding:4px 14px}
.item{gap:12px;padding:12px 0}
.ib{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;box-shadow:0 2px 6px #0003}
.il{flex:1;min-width:0}
.seg{display:flex;background:var(--other);border-radius:12px;padding:3px}
.seg button{margin:0;padding:6px 11px;border-radius:9px;font-size:13px}
.seg button.g{background:transparent;color:var(--muted);box-shadow:none}
.sws{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;max-width:130px}
.sw{width:22px;height:22px;margin:2px;border-width:2px}.sw.on{border-color:var(--text);transform:scale(1.15)}
input[type=range]{width:110px;accent-color:var(--accent)}
input.sw2{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--other);position:relative;cursor:pointer;flex:none;padding:0;border:0;transition:background .2s}
input.sw2::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0004;transition:transform .2s}
input.sw2:checked{background:var(--accent)}input.sw2:checked::after{transform:translateX(20px)}
.foot{text-align:center;color:var(--muted);font-size:12px;white-space:pre-line;margin:20px 0 4px}

/* ===== стиль Telegram ===== */
:root{--bg:#eef1f5;--panel:#fff;--other:#eef1f5;--line:#e6e9ee;--accent:#2b95ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111821;--panel:#1a2432;--other:#243040;--line:#243040;--muted:#7d8a99}}
:root[data-theme="dark"]{--bg:#111821;--panel:#1a2432;--other:#243040;--line:#243040;--muted:#7d8a99}
body{background:var(--bg)}
button{border-radius:22px}
button:not(.g):not(.d){background:var(--accent);box-shadow:none}
#app{background:var(--bg)}#side{background:var(--bg);position:relative}
#side .top{border:0;padding:16px 14px 8px}
.ttl{flex:1;font-size:24px;font-weight:700}
/* островок с названием */
#side .top{flex-wrap:nowrap;align-items:center}
#side .top .ttl{flex:0 1 auto;min-width:0;margin-right:auto;text-align:center;font-size:20px;font-weight:800;letter-spacing:.2px;padding:7px 15px;border-radius:999px;color:#ffffffe6;font-weight:700;background:color-mix(in srgb,#000 45%,var(--panel));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 10%,transparent),0 2px 6px #0003}
#side .top #jc{margin-left:0}
@media(min-width:641px){#side .top .ttl{font-size:17px;padding:6px 13px}}
#side .top .ttl,#side .top .ttl *{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;outline:none;touch-action:manipulation}
#side .top .ttl::selection,#side .top .ttl *::selection{background:transparent;color:inherit}
.row .cx{flex:1;min-width:0}
.row .rt,.row .rb{display:flex;align-items:center;gap:8px;min-width:0}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.row .tm{flex:none;font-size:12px;color:var(--muted)}
.row .pv{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:14px;margin-top:2px}
.row .rb .ub{margin-left:0}

#side .top .ib2{flex:none;width:40px;height:40px;padding:0;border-radius:50%;font-size:18px}
#list{padding:0 6px 110px}
.row{margin:2px 0;padding:10px 12px;gap:14px}.row div:first-child{font-size:16px;font-weight:600}
#msgs{background:var(--bg)}
.m{border:0;box-shadow:none;background:var(--panel)}
.me .m{background:var(--accent)}
#reg h2{background:none;color:var(--text)}
.pg{position:relative;height:100%;max-width:520px;margin:0 auto}
.pgs{height:100%;overflow-y:auto;padding:0 14px 120px}
.ph2{text-align:center;padding:36px 16px 18px}.ph2 .av{width:100px;height:100px;font-size:50px}
.ph2 .n{font-size:26px;font-weight:700;margin-top:12px}.ph2 .s{color:var(--muted);margin-top:4px}
.card{background:var(--panel);border:0;box-shadow:none;border-radius:24px;padding:6px 0;margin-bottom:14px}
.li{display:flex;gap:16px;align-items:center;padding:12px 18px;cursor:pointer}.li:active{background:var(--other)}
.li .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.li .ic span{filter:brightness(0) invert(1)}
.lt{flex:1;min-width:0}.tt{font-size:17px}.ss{font-size:14px;color:var(--muted);margin-top:1px}
.rc{margin-left:auto}
.tabs{position:absolute;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);border-radius:34px;display:flex;padding:6px;box-shadow:0 4px 22px #0005;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:28px;font-size:12px;font-weight:600;cursor:pointer;position:relative;min-width:0}
.tab.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.tab .av{width:26px;height:26px;font-size:14px;box-shadow:none}
.tab .bd{position:absolute;top:1px;left:52%;background:var(--accent);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
.sh{padding:14px 2px}.sh h2{font-size:24px}
.clip{position:relative;overflow:hidden;width:46px;height:46px;border-radius:50%;background:var(--other);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex:none}
.clip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;font-size:0;cursor:pointer;border:0}
.mm{display:block;width:260px;max-width:100%;max-height:340px;object-fit:cover;border-radius:12px;margin:2px 0 6px;cursor:pointer;background:#0003}
video.mm{object-fit:contain;background:#000}
#tabhost{position:fixed;z-index:8}
@media (max-width:640px){#tabhost.hid{display:none!important}}
@media (min-width:641px){#tabhost{left:max(12px,calc(50% - 500px + 12px));right:auto;width:236px;margin:0;bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
.codec{text-align:center;padding:16px 18px}.codec .stitle{margin:0}
.cv{font-size:34px;font-weight:700;letter-spacing:6px;margin:8px 0;font-family:ui-monospace,Menlo,monospace;user-select:all}
.codec .ss{margin-bottom:12px}

:root[data-theme="dark"]{--chatbg:#060907;--in:#202a26;--out:#4d9a52;--outT:#fff;--doodle:rgba(130,165,120,.24)}

r='3'/%3E%3Cpath d='M30 170q10-14 20 0t20 0'/%3E%3Cpath d='M100 170a14 14 0 1 1 14 14a8 8 0 1 1-8-8'/%3E%3Cpath d='M170 160l18 30h-36z'/%3E%3Ccircle cx='60' cy='220' r='5'/%3E%3Ccircle cx='150' cy='214' r='9'/%3E%3Cpath d='M200 210l14 14m0-14l-14 14'/%3E%3C/svg%3E") 0 0/240px 240px repeat;pointer-events:none}

    li(c,"🎨","#ec4899","Цвет акцента",null,null,sw);

    li(c,"🔔","#ef4444","Звук сообщений","Сигнал при новом сообщении в открытом чате",null,tog("sound"));
    const vr=el("input");vr.type="range";vr.min=1;vr.max=10;vr.value=prefs.vol;vr.oninput=()=>{prefs.vol=+vr.value};vr.onchange=()=>{savePrefs();beep()};

      const av0=avEl(u.av,46);if(window.presDot)window.presDot(av0,id);d.append(av0,x,rn,rm);d.onclick=()=>openDM(id);c.appendChild(d)});

  }

let PRES={},started=false;
const fv=()=>firebase.firestore.FieldValue;
const ms=t=>t?(t.toMillis?t.toMillis():+t):0;
const hm=d=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
function isOn(id){const p=PRES[id];return !!(p&&p.on&&Date.now()-ms(p.ts)<FRESH)}
window.presText=function(id){
  const p=PRES[id];if(!p)return "не в сети";
  if(isOn(id))return "в сети";
  const t=ms(p.ts);if(!t)return "не в сети";
  const d=new Date(t),n=new Date(),y=new Date(n.getFullYear(),n.getMonth(),n.getDate()-1);
  if(d.toDateString()===n.toDateString())return "был(а) в "+hm(d);
  if(d.toDateString()===y.toDateString())return "был(а) вчера в "+hm(d);
  return "был(а) "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0");
};

 <script>
/* ===== Голосовые звонки 1 на 1 ===== */
(function(){
const PUSH_URL="https://kolobok-push.sashok08700.workers.dev";
const ICE={iceServers:[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}]};
let pc=null,stream=null,callId=null,unsub=null,timer=null,ui=null,audioEl=null,active=false,pending=null;

const $=id=>document.getElementById(id);
const say=t=>{try{toast(t)}catch(e){}};
const nameOf=id=>{try{return (NICKS&&NICKS[id])||(users[id]&&users[id].name)||"Собеседник"}catch(e){return "Собеседник"}};

function gathered(p){return new Promise(res=>{
  if(p.iceGatheringState==="complete")return res();
  const done=()=>{p.removeEventListener("icegatheringstatechange",chk);res()};
  const chk=()=>{if(p.iceGatheringState==="complete")done()};
  p.addEventListener("icegatheringstatechange",chk);
  setTimeout(done,3500);
})}

function showUI(title,sub,buttons){
  if(!ui){
    ui=document.createElement("div");
    ui.style.cssText="position:fixed;inset:0;z-index:50;background:#000c;display:flex;align-items:center;justify-content:center;padding:16px";
    document.body.appendChild(ui);
  }
  ui.innerHTML="";
  const box=document.createElement("div");
  box.style.cssText="background:var(--panel);color:var(--text);border-radius:22px;padding:28px 24px;width:100%;max-width:320px;text-align:center;box-shadow:0 12px 48px #0006";
  const h=document.createElement("div");
  h.style.cssText="font-size:20px;font-weight:600";
  h.textContent=title;
  const s=document.createElement("div");
  s.id="callsub";
  s.style.cssText="margin:8px 0 22px;color:var(--muted)";
  s.textContent=sub;
  const row=document.createElement("div");
  row.style.cssText="display:flex;gap:10px;justify-content:center";
  buttons.forEach(([label,cls,fn])=>{
    const b=document.createElement("button");
    b.textContent=label;
    if(cls)b.className=cls;
    b.onclick=fn;
    row.appendChild(b);
  });
  box.append(h,s,row);
  ui.appendChild(box);
}
function hideUI(){if(ui){ui.remove();ui=null}}

function cleanup(){
  if(unsub){unsub();unsub=null}
  if(timer){clearInterval(timer);timer=null}
  if(pc){try{pc.close()}catch(e){}pc=null}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  if(audioEl){audioEl.srcObject=null}
  callId=null;active=false;
  hideUI();
}
async function endCall(status){
  const id=callId;
  cleanup();
  if(id){try{await db.collection("calls").doc(id).update({status:status||"ended"})}catch(e){}}
}

async function mic(){
  try{return await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){say("Нет доступа к микрофону");return null}
}
function makePc(){
  const p=new RTCPeerConnection(ICE);
  stream.getTracks().forEach(t=>p.addTrack(t,stream));
  p.ontrack=e=>{
    if(!audioEl){
      audioEl=document.createElement("audio");
      audioEl.autoplay=true;
      audioEl.setAttribute("playsinline","");
      document.body.appendChild(audioEl);
    }
    audioEl.srcObject=e.streams[0];
    audioEl.play().catch(()=>{});
  };
  p.onconnectionstatechange=()=>{
    if(p===pc&&p.connectionState==="failed"){say("Не удалось соединиться");endCall("ended")}
  };
  return p;
}

function startTimer(name){
  const t0=Date.now();
  showUI(name,"00:00",[["Завершить","d",()=>endCall("ended")]]);
  timer=setInterval(()=>{
    const x=Math.floor((Date.now()-t0)/1000);
    const s=$("callsub");
    if(s)s.textContent=String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0");
  },1000);
}

function watch(id,name,isCaller){
  unsub=db.collection("calls").doc(id).onSnapshot(s=>{
    if(!s.exists)return;
    const d=s.data();
    if(isCaller&&d.answer&&pc&&pc.signalingState==="have-local-offer"){
      pc.setRemoteDescription(d.answer).catch(e=>say("Ошибка звонка: "+e.message));
    }
    if(d.status==="active"&&!active){active=true;startTimer(name)}
    if(d.status==="ended"||d.status==="declined"||d.status==="missed"){
      if(d.status==="declined")say("Звонок отклонён");
      cleanup();
    }
  },e=>say("Ошибка звонка: "+e.message));
}

async function push(to,title,body){
  try{
    const s=await db.doc("pushTokens/"+to).get();
    const tokens=(s.exists&&s.data().tokens)||[];
    if(!tokens.length)return;
    fetch(PUSH_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({tokens:tokens,title:title,body:body})
    }).catch(()=>{});
  }catch(e){}
}

async function startCall(){
  if(pc||callId)return say("Звонок уже идёт");
  const c=typeof curChat==="function"?curChat():null;
  if(!c||!c.dm)return;
  const to=other(c);
  stream=await mic();
  if(!stream)return;
  try{
    pc=makePc();
    showUI(nameOf(to),"Вызываю…",[["Отмена","d",()=>endCall("ended")]]);
    await pc.setLocalDescription(await pc.createOffer());
    await gathered(pc);
    if(!pc)return;
    const ref=db.collection("calls").doc();
    callId=ref.id;
    await ref.set({
      from:uid,to:to,chatId:c.id,status:"ringing",ts:Date.now(),
      offer:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}
    });
    watch(ref.id,nameOf(to),true);
    push(to,"Входящий звонок",nameOf(uid)+" звонит вам");
    const myId=ref.id;
    setTimeout(()=>{if(callId===myId&&!active){say("Нет ответа");endCall("missed")}},45000);
  }catch(e){
    say("Ошибка звонка: "+(e.message||e));
    endCall("ended");
  }
}

function incoming(id,d){
  pending=id;
  try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
  showUI(nameOf(d.from),"Входящий звонок…",[
    ["Отклонить","d",()=>{
      pending=null;hideUI();
      db.collection("calls").doc(id).update({status:"declined"}).catch(()=>{});
    }],
    ["Принять","",()=>accept(id,d)]
  ]);
}
async function accept(id,d){
  pending=null;
  showUI(nameOf(d.from),"Соединяю…",[["Завершить","d",()=>endCall("ended")]]);
  stream=await mic();
  if(!stream){
    hideUI();
    db.collection("calls").doc(id).update({status:"declined"}).catch(()=>{});
    return;
  }
  try{
    pc=makePc();
    callId=id;
    await pc.setRemoteDescription(d.offer);
    await pc.setLocalDescription(await pc.createAnswer());
    await gathered(pc);
    if(!pc)return;
    await db.collection("calls").doc(id).update({
      answer:{type:pc.localDescription.type,sdp:pc.localDescription.sdp},
      status:"active"
    });
    watch(id,nameOf(d.from),false);
  }catch(e){
    say("Ошибка звонка: "+(e.message||e));
    endCall("ended");
  }
}

function listen(){
  db.collection("calls").where("to","==",uid).where("status","==","ringing").onSnapshot(qs=>{
    qs.docChanges().forEach(ch=>{
      if(ch.type==="removed"){
        if(pending===ch.doc.id&&!callId){pending=null;hideUI()}
        return;
      }
      if(ch.type!=="added")return;
      const d=ch.doc.data();
      if(Date.now()-d.ts>60000)return;
      if(pc||callId||pending){
        db.collection("calls").doc(ch.doc.id).update({status:"declined"}).catch(()=>{});
        return;
      }
      incoming(ch.doc.id,d);
    });
  },e=>say("Звонки: "+e.message));
}

const PHONE='<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>';
function addBtn(){
  try{
    const c=typeof curChat==="function"?curChat():null;
    const h=$("head");
    if(!h||!c||!c.dm||$("callbtn"))return;
    const b=document.createElement("button");
    b.id="callbtn";
    b.className="hb";
    b.innerHTML=PHONE;
    b.title="Позвонить";
    b.onclick=startCall;
    h.appendChild(b);
  }catch(e){}
}
const _rm=window.renderMain;
if(typeof _rm==="function"){
  window.renderMain=function(){
    const r=_rm.apply(this,arguments);
    addBtn();
    return r;
  };
}

const iv=setInterval(()=>{
  if(typeof me!=="undefined"&&me&&typeof uid!=="undefined"&&uid&&typeof db!=="undefined"&&db){
    clearInterval(iv);
    listen();
    addBtn();
  }
},800);
})();

 <script>
/* ===== Рингтон звонка ===== */
(function(){
let ctx=null,timer=null,mode=null;

function unlock(){
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==="suspended")ctx.resume();
  }catch(e){}
}
document.addEventListener("pointerdown",unlock,{once:true});
document.addEventListener("touchstart",unlock,{once:true});

function beep(freq,dur,when,vol){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type="sine";
  o.frequency.value=freq;
  o.connect(g);
  g.connect(ctx.destination);
  const t=ctx.currentTime+when;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.02);
  g.gain.setValueAtTime(vol,t+dur-0.05);
  g.gain.linearRampToValueAtTime(0,t+dur);
  o.start(t);
  o.stop(t+dur+0.02);
}
function ringIn(){
  beep(880,0.4,0,0.3);
  beep(660,0.4,0.5,0.3);
  beep(880,0.4,1.0,0.3);
  beep(660,0.4,1.5,0.3);
  try{navigator.vibrate&&navigator.vibrate([400,200,400,200,400])}catch(e){}
}
function ringOut(){
  beep(425,1.0,0,0.15);
}

function start(m){
  if(mode===m)return;
  stop();
  unlock();
  if(!ctx)return;
  mode=m;
  const f=m==="in"?ringIn:ringOut;
  f();
  timer=setInterval(f,m==="in"?3000:4000);
}
function stop(){
  if(timer){clearInterval(timer);timer=null}
  if(mode){
    mode=null;
    try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}
  }
}

function check(){
  const s=document.getElementById("callsub");
  const t=s?s.textContent:"";
  if(t==="Входящий звонок…")start("in");
  else if(t==="Вызываю…")start("out");
  else stop();
}
new MutationObserver(check).observe(document.body,{childList:true,subtree:true,characterData:true});
})();
 </script>
